<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>采集投递草稿</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="title-row"><h1>采集投递草稿</h1><button id="open-settings" type="button">设置</button></div>
      <p id="feedback" role="status">正在读取当前页面…</p>
      <button id="ai-fill" class="ai" type="button">✨ AI 一键填写</button>
      <form id="capture-form">
        <div class="submit-mode"><label><input type="radio" name="entryMode" value="company-job" checked>企业＋岗位</label><label><input type="radio" name="entryMode" value="company-only">仅添加企业</label></div>
        <fieldset id="job-fields">
          <legend>企业父条目</legend>
          <label>企业名称<input name="companyName" required maxlength="120"></label>
          <label>企业简称<input name="companyShortName" maxlength="60"></label>
          <label>企业官网<input name="companyWebsite" type="url" maxlength="4096"></label>
        </fieldset>
        <fieldset>
          <legend>岗位子条目</legend>
          <label>岗位名称<input name="jobTitle" required maxlength="160"></label>
          <label>地点<input name="location" maxlength="100"></label>
          <label>批次<input name="batch" maxlength="100"></label>
          <label>岗位链接<input name="sourceUrl" type="url" maxlength="4096"></label>
          <label>备注<textarea name="notes" maxlength="2000"></textarea></label>
        </fieldset>
        <button class="primary" type="submit">添加到投递台</button>
      </form>
      <section>
        <h2>发送失败的草稿</h2>
        <ul id="queue"><li class="empty">正在读取…</li></ul>
      </section>
      <dialog id="settings-dialog">
        <form id="settings-form" method="dialog">
          <h2>AI 设置</h2>
          <label>开发商<select name="provider"><option value="deepseek">DeepSeek</option></select></label>
          <label>API Key<input name="apiKey" type="password" autocomplete="off" placeholder="sk-…" required></label>
          <label>模型<input name="model" value="deepseek-chat" required maxlength="100"></label>
          <p class="hint">密钥只保存在此浏览器的扩展本地存储中，不会写入项目。</p>
          <div class="dialog-actions"><button type="button" id="cancel-settings">取消</button><button class="primary">保存设置</button></div>
        </form>
      </dialog>
      <dialog id="success-dialog"><div class="success-mark">✓</div><h2>已提交</h2><p>企业和岗位信息已添加到求职投递台。</p><button id="close-success" class="primary" type="button">知道了</button></dialog>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
